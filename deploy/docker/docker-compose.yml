# -----------------------------------------------------------------------------
# Local development stack.
#
#   docker compose -f deploy/docker/docker-compose.yml up -d
#
# Brings up PostgreSQL and pgAdmin only — the API and the Angular app run from
# your IDE with hot reload, which is far faster to iterate on than rebuilding a
# container on every change. Dockerfiles for both exist for CI and production.
# -----------------------------------------------------------------------------
name: woodheart

services:
  postgres:
    image: postgres:17-alpine
    container_name: woodheart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: woodheart
      POSTGRES_USER: woodheart
      POSTGRES_PASSWORD: woodheart
      # C collation keeps index behaviour identical across dev machines and the
      # production server, whatever locale the host happens to have.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # The API waits on this, so it must test a real query, not just the port.
      test: ["CMD-SHELL", "pg_isready -U woodheart -d woodheart"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: woodheart-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@woodheart.local
      PGADMIN_DEFAULT_PASSWORD: woodheart
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    profiles:
      # Not started by default — `--profile tools up` when you actually want it.
      - tools

volumes:
  postgres-data:
  pgadmin-data:
