name: AI Review

# An automated first-pass review on every pull request into develop or main.
#
# It does not replace the human reviewer and it cannot approve anything — the
# branch protection rule still requires a human approval before merge. What it
# does is arrive within a couple of minutes and catch the things a tired
# reviewer skims past: a missing IUnitOfWork commit, a decimal that should be
# Money, a DateTime.UtcNow that should be IDateTimeProvider.
#
# Requires one repository secret: ANTHROPIC_API_KEY.
#   gh secret set ANTHROPIC_API_KEY --repo aslam6161/WoodHeart_BE
# Without it every job below no-ops with a notice instead of failing, so the
# repository still works for anyone who has not set it up.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, develop]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  # One review per pull request. Pushing three commits in a row should produce
  # one review of the final state, not three reviews of three intermediate ones.
  group: ai-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude Review
    runs-on: ubuntu-latest
    # Drafts are work in progress; reviewing them is noise.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          # The full history, so the review can see what the branch changed
          # rather than just the tip commit.
          fetch-depth: 0

      # The secrets context is not usable in a job-level `if`, and a pull
      # request from a fork never receives secrets at all. So the guard lives
      # here: no key means a notice and a green check, not a red one.
      - name: Is the API key configured?
        id: guard
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY is not set — skipping the AI review."
          fi

      - name: Review the diff
        if: steps.guard.outputs.enabled == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: '--model claude-opus-5 --allowed-tools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh api:*)"'
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in
            ${{ github.repository }} — the WoodHeart API, a .NET 10 layered
            backend for an interior design business in Bangladesh.

            Read CONTRIBUTING.md and the "Conventions worth knowing" section of
            README.md first. Those are the house rules and they are what this
            review is for.

            Leave inline comments on specific lines. Prioritise, in order:

            1. Correctness bugs — wrong results, unhandled nulls, race
               conditions, broken async, N+1 queries, missing await.
            2. Violations of the layering rule (Domain → Repository → Service →
               Presentation). The architecture tests catch imports; they do not
               catch a controller quietly making a business decision.
            3. The project conventions that are easy to break and expensive to
               find later:
                  - Money for money, never decimal or double.
                  - PhoneNumber for phone numbers, normalised to +8801XXXXXXXXX.
                  - IDateTimeProvider, never DateTime.UtcNow.
                  - Only the service owning the use case commits, via
                    IUnitOfWork. A helper that saves flushes its caller's
                    half-finished work.
                  - Business failures are GeneralResponse values with a stable
                    ErrorCode, not exceptions.
                  - Stock never moves without a StockMovement row.
                  - Order lines snapshot their price at placement.
            4. Security — authorization gaps, injection, secrets in source,
               overly broad CORS, anything logged that should not be.
            5. Missing tests for genuinely new behaviour.

            Be specific and concrete: point at the line, say what breaks, say
            what to do instead. Skip style and formatting — the analysers and
            .editorconfig already own that, and a review full of nitpicks is a
            review nobody reads.

            If the change is small and clean, say so in one line. Do not invent
            problems to look thorough. Do not approve or request changes as a
            formal review state; a human does that.

  mention:
    name: Claude Mention
    runs-on: ubuntu-latest
    # Lets a reviewer pull the agent back in on a specific thread:
    # "@claude is this repository call going to N+1?"
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Is the API key configured?
        id: guard
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY is not set — skipping."
          fi

      - name: Answer the mention
        if: steps.guard.outputs.enabled == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: '--model claude-opus-5'
