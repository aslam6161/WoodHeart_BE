name: Backend CI

on:
  push:
    # Long-lived branches plus the working branches described in CONTRIBUTING.md.
    # Pushing to a phase branch runs the full suite, so the pull request into
    # develop opens with its checks already green rather than pending.
    branches:
      - main
      - develop
      - 'phase/**'
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
    paths: ['backend/**', 'deploy/docker/**', '.github/workflows/backend-ci.yml']
  # No paths filter on pull_request, deliberately. These jobs are required
  # status checks, and a required check that never runs sits "expected" for
  # ever and blocks the merge. A docs-only pull request paying for a build is
  # a far smaller problem than a pull request nothing can merge.
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# A second push to the same branch cancels the first. On main this is switched
# off in cd.yml — cancelling a half-finished deployment is how you end up with
# an image pushed but never released.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      # A real PostgreSQL, not the EF in-memory provider. In-memory does not
      # enforce unique indexes, does not run our filtered indexes, and silently
      # accepts SQL that Postgres rejects — so it proves nothing about the code
      # that will actually run in production.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: woodheart_test
          POSTGRES_USER: woodheart
          POSTGRES_PASSWORD: woodheart
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U woodheart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        working-directory: backend
        run: dotnet restore

      - name: Build
        working-directory: backend
        run: dotnet build --no-restore -c Release

      # Run first and separately: if the layering is broken, the other results
      # do not matter and this failure is the one worth reading.
      - name: Architecture tests
        working-directory: backend
        run: >-
          dotnet test WoodHeart.Tests --no-build -c Release
          --filter "FullyQualifiedName~Architecture"
          --logger "console;verbosity=normal"

      # One test project, so one run. The architecture subset above is repeated
      # here rather than excluded — running it twice costs a second and keeps
      # the coverage numbers honest.
      - name: Tests
        working-directory: backend
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=woodheart_test;Username=woodheart;Password=woodheart"
          Jwt__SigningKey: "ci-only-signing-key-not-used-anywhere-else-32chars"
        run: >-
          dotnet test WoodHeart.Tests --no-build -c Release
          --logger trx --results-directory ../TestResults
          --collect:"XPlat Code Coverage"

      - name: Verify migrations apply to an empty database
        working-directory: backend
        env:
          WOODHEART_MIGRATIONS_CONNECTION: "Host=localhost;Port=5432;Database=woodheart_migrations;Username=woodheart;Password=woodheart"
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.* || dotnet tool update --global dotnet-ef --version 10.0.*
          export PATH="$PATH:$HOME/.dotnet/tools"
          # Catches the migration that works on a developer's existing database
          # but fails from scratch — which is exactly what production is.
          dotnet ef database update \
            --project WoodHeart.Repository \
            --startup-project WoodHeart.Repository \
            --context DataContext

      # ---------------------------------------------------------------------
      # The first time any of this runs against a real database with real rows.
      # Unit tests use substitutes and the integration tests deliberately avoid
      # Postgres, so until now nothing had proved a product can actually be
      # written and read back — only that the schema applies.
      #
      # Reuses woodheart_migrations, which the step above just migrated.
      #
      # NOTE ON SHELL STYLE: no pipelines. `set -o pipefail` plus a consumer
      # that exits early — `head -c`, `grep -q` — makes the producer take
      # SIGPIPE, the pipeline return non-zero, and `set -e` kill the script
      # silently before any assertion runs. That is exactly how the first
      # version of this step failed with no message at all. Bash here-strings
      # do the same job with no pipe in sight.
      # ---------------------------------------------------------------------
      - name: Seed the catalog and smoke test the storefront
        working-directory: backend/WoodHeart.Presentation
        shell: bash
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5199
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=woodheart_migrations;Username=woodheart;Password=woodheart"
          Jwt__SigningKey: "ci-only-signing-key-not-used-anywhere-else-32chars"
          Seed__Enabled: "true"
          Seed__Catalog: "true"
        run: |
          set -euo pipefail

          dotnet run --no-build -c Release --no-launch-profile > /tmp/api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 40); do
            if curl -fsS --max-time 3 http://localhost:5199/health/ready > /dev/null 2>&1; then
              echo "API ready after ${i}s."
              break
            fi
            if ! kill -0 $API_PID 2>/dev/null; then
              echo "::error::The API exited during startup."
              tail -n 80 /tmp/api.log
              exit 1
            fi
            sleep 1
          done

          fail() { echo "::error::$1"; tail -n 60 /tmp/api.log; exit 1; }
          has()  { grep -qi -- "$2" <<< "$1"; }

          echo "--- category tree ---"
          TREE=$(curl -fsS http://localhost:5199/api/catalog/categories) || fail "category tree request failed"
          printf '%.500s\n' "$TREE"
          has "$TREE" 'bedroom' || fail "Bedroom is missing from the tree"
          has "$TREE" 'beds'    || fail "the tree was not nested - Beds is missing"

          echo "--- product listing ---"
          LIST=$(curl -fsS "http://localhost:5199/api/catalog/products?pageSize=50") || fail "listing failed"
          has "$LIST" 'segun-king-bed' || fail "the seeded bed is not listed"

          echo "--- pagination header is exposed ---"
          # -D - with -o /dev/null, not -I. curl -I sends HEAD, and an MVC
          # action attributed [HttpGet] does not match HEAD -- it answers 405,
          # which -f turns into a failure that looks like a missing header.
          HEADERS=$(curl -fsS -D - -o /dev/null "http://localhost:5199/api/catalog/products") || fail "header request failed"
          has "$HEADERS" 'x-pagination:' || fail "X-Pagination header is missing"
          has "$HEADERS" 'access-control-expose-headers' || fail "X-Pagination is not exposed to the browser"

          echo "--- product detail, variants and price fallback ---"
          BED=$(curl -fsS http://localhost:5199/api/catalog/products/segun-king-bed) || fail "detail failed"
          has "$BED" 'WH-BED-001-SG-6' || fail "variants did not round-trip"
          # The 6ft Segun variant carries no price override, so it must inherit
          # 68500 from the product. This is the jsonb and Money mapping working
          # end to end for the first time.
          has "$BED" '68500' || fail "the inherited variant price is wrong"
          # Bangla must come back as Bangla, not as escaped ASCII.
          has "$BED" 'সেগুন' || fail "Bangla did not survive the round trip"
          has "$BED" 'breadcrumbs' || fail "breadcrumbs are missing"

          echo "--- a draft must NOT be reachable ---"
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5199/api/catalog/products/showcase-cabinet)
          [ "$STATUS" = "404" ] || fail "a Draft product was served to the public (HTTP $STATUS)"

          echo "--- ?status=Draft must not override the public filter ---"
          DRAFTS=$(curl -fsS "http://localhost:5199/api/catalog/products?status=Draft&pageSize=50") || fail "draft-filter request failed"
          if has "$DRAFTS" 'showcase-cabinet'; then
            fail "the status filter was honoured - drafts leaked to the storefront"
          fi

          echo "--- collections ---"
          curl -fsS http://localhost:5199/api/catalog/collections/shop-the-bedroom > /dev/null || fail "collection request failed"

          echo "--- admin routes stay protected ---"
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5199/api/admin/products)
          [ "$STATUS" = "401" ] || fail "admin products returned $STATUS, expected 401"

          echo "All storefront smoke checks passed."

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          retention-days: 14

  security-scan:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Check for vulnerable packages
        working-directory: backend
        run: |
          dotnet restore
          # Transitive included: the Hangfire → Newtonsoft.Json chain is exactly
          # the kind of thing a direct-only scan misses.
          dotnet list package --vulnerable --include-transitive 2>&1 | tee audit.log
          if grep -q "has the following vulnerable packages" audit.log; then
            echo "::error::Vulnerable NuGet packages detected — see the log above."
            exit 1
          fi

      - name: Check for deprecated packages
        working-directory: backend
        continue-on-error: true
        run: dotnet list package --deprecated

  branch-name:
    name: Branch Name
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      # Cheap, and it catches the mistake before a reviewer has to. The names
      # are not cosmetic: cd.yml and the branch protection rules both key off
      # them, so a branch called "my-stuff" silently skips checks it should run.
      - name: Check the source branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          # develop → main is the release pull request; it is exempt by design.
          if [ "$BRANCH" = "develop" ]; then
            echo "Release pull request from develop — no name check."
            exit 0
          fi
          if echo "$BRANCH" | grep -Eq '^(phase|feature|fix|chore|docs|refactor)/[a-z0-9][a-z0-9._-]*$'; then
            echo "OK: $BRANCH"
            exit 0
          fi
          echo "::error::Branch '$BRANCH' does not match the convention."
          echo "Expected <type>/<slug>, lower-case, where type is one of:"
          echo "  phase feature fix chore docs refactor"
          echo "Examples: phase/1-catalog, fix/order-total-rounding"
          echo "See CONTRIBUTING.md."
          exit 1

  docker-image:
    name: Docker Image Builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Builds but does not push. A Dockerfile that only gets exercised on a
      # merge to main is a Dockerfile that breaks on the day you most need it.
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.api
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
