name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml']
  pull_request:
    branches: [main, develop]
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: frontend/woodheart-web

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Reads .nvmrc, so CI and every developer machine track one version.
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: frontend/woodheart-web/package-lock.json

      # `npm ci` not `npm install`: it installs exactly what the lockfile says
      # and fails if package.json and the lockfile disagree, which is what you
      # want in CI and never what you want locally.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      # Angular 21 runs unit tests on Vitest, not Karma — there is no
      # --browsers flag, and passing one fails the step.
      - name: Unit tests
        run: npm test -- --watch=false

      - name: Build (production, with SSR)
        run: npm run build -- --configuration production

      # The production build above already fails on a budget breach, so this
      # step only reports. The figure worth watching is the gzipped transfer
      # size rather than the raw total: Bootstrap's CSS is ~227 kB raw but
      # ~23 kB over the wire, and this storefront is served to mid-range
      # phones on 4G.
      - name: Report bundle size
        run: du -sh dist/ || true

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/woodheart-web/dist/
          retention-days: 7
